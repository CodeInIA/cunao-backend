name: Admin Panel & Authentication

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'src/controllers/adminController.ts'
      - 'src/routes/admin.ts'
      - 'src/middleware/adminAuth.ts'
      - 'src/models/User.ts'
      - 'scripts/createAdmin.ts'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'src/controllers/adminController.ts'
      - 'src/routes/admin.ts'
  workflow_dispatch:

jobs:
  test-admin:
    runs-on: ubuntu-latest
    
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/test-db
      JWT_SECRET: fake_jwt_secret_key_for_testing_workflow_only_12345
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run admin-related unit tests
      run: npm test -- --testPathPattern=admin || echo "No admin tests found"
      continue-on-error: true
    
    - name: Build and Type Check
      run: npm run build
    
    - name: Verify JWT token generation
      run: |
        echo "Verifying JWT token generation and validation"
        npm run build
    
    - name: Test password security
      run: |
        echo "Testing password hashing and comparison"
        npm run build
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: admin-test-results
        path: coverage/
        retention-days: 7
