name: Discounts & Promotions

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'src/controllers/discountController.ts'
      - 'src/routes/discounts.ts'
      - 'src/models/DiscountCode.ts'
      - 'src/cron/createDiscountCode.ts'
      - 'src/cron/activateScheduledDiscounts.ts'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'src/controllers/discountController.ts'
      - 'src/routes/discounts.ts'
  workflow_dispatch:

jobs:
  test-discounts:
    runs-on: ubuntu-latest
    
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/test-db
      STRIPE_SECRET_KEY: sk_test_fake_key_for_workflow_compilation_only
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Test Discount Controller
      run: |
        echo "Testing discount code validation and application"
        npx tsc --noEmit src/controllers/discountController.ts
    
    - name: Test Discount Model
      run: |
        echo "Testing discount code schema and validations"
        npx tsc --noEmit src/models/DiscountCode.ts
    
    - name: Run discount-related unit tests
      run: npm test -- --testPathPattern=discount
      continue-on-error: true
    
    - name: Check discount routes configuration
      run: |
        echo "Validating discount routes"
        npx tsc --noEmit src/routes/discounts.ts
    
    - name: Test discount creation cron job
      run: |
        echo "Testing automatic discount code generation"
        npx tsc --noEmit src/cron/createDiscountCode.ts
    
    - name: Test scheduled discount activation
      run: |
        echo "Testing scheduled discount activation"
        npx tsc --noEmit src/cron/activateScheduledDiscounts.ts
    
    - name: Verify discount logic
      run: |
        echo "Verifying discount calculation and expiration logic"
        npm run build
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: discounts-test-results
        path: coverage/
        retention-days: 7
