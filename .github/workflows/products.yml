name: Products & Catalog

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'src/controllers/productController.ts'
      - 'src/routes/products.ts'
      - 'src/services/printifyService.ts'
      - 'src/controllers/weeklyProductsController.ts'
      - 'src/models/WeeklyProducts.ts'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'src/controllers/productController.ts'
      - 'src/routes/products.ts'
  workflow_dispatch:

jobs:
  test-products:
    runs-on: ubuntu-latest
    
    env:
      NODE_ENV: test
      PRINTIFY_API_TOKEN: fake_printify_token_12345678901234567890
      PRINTIFY_SHOP_ID: "1234567"
      MONGODB_URI: mongodb://localhost:27017/test-db
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run product-related unit tests
      run: npm test -- --testPathPattern=product || echo "No product tests found"
      continue-on-error: true
    
    - name: Build and Type Check
      run: npm run build
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: products-test-results
        path: coverage/
        retention-days: 7
