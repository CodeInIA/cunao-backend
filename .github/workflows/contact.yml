name: Contact & Communication

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'src/controllers/contactController.ts'
      - 'src/routes/contact.ts'
      - 'src/services/emailService.ts'
      - 'src/services/notificationService.ts'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'src/controllers/contactController.ts'
      - 'src/routes/contact.ts'
  workflow_dispatch:

jobs:
  test-contact:
    runs-on: ubuntu-latest
    
    env:
      NODE_ENV: test
      EMAIL_USER: test@example.com
      EMAIL_PASS: fake_email_password_12345
      ADMIN_EMAIL: admin@example.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run contact-related unit tests
      run: npm test -- --testPathPattern=contact || echo "No contact tests found"
      continue-on-error: true
    
    - name: Build and Type Check
      run: npm run build
    
    - name: Verify spam protection
      run: |
        echo "Verifying rate limiting and validation"
        npm run build
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: contact-test-results
        path: coverage/
        retention-days: 7
