name: Database & Models

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'src/models/**'
      - 'src/services/databaseService.ts'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'src/models/**'
      - 'src/services/databaseService.ts'
  workflow_dispatch:

jobs:
  test-database:
    runs-on: ubuntu-latest
    
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/test-db
    
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run database-related unit tests
      run: npm test -- --testPathPattern=model || echo "No model tests found"
      continue-on-error: true
    
    - name: Build and verify all models
      run: npm run build
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: database-test-results
        path: coverage/
        retention-days: 7
