name: Image Management

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'src/controllers/imageController.ts'
      - 'src/routes/images.ts'
      - 'src/services/imageService.ts'
      - 'src/utils/imageUtils.ts'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'src/controllers/imageController.ts'
      - 'src/routes/images.ts'
  workflow_dispatch:

jobs:
  test-images:
    runs-on: ubuntu-latest
    
    env:
      NODE_ENV: test
      CLOUDINARY_CLOUD_NAME: fake-cloud-name
      CLOUDINARY_API_KEY: "123456789012345"
      CLOUDINARY_API_SECRET: fake_cloudinary_secret_abcdef123456
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Test Image Controller
      run: |
        echo "Testing image upload and management"
        npx tsc --noEmit src/controllers/imageController.ts
    
    - name: Test Image Service
      run: |
        echo "Testing Cloudinary integration"
        npx tsc --noEmit src/services/imageService.ts
    
    - name: Test Image Utils
      run: |
        echo "Testing image processing utilities"
        npx tsc --noEmit src/utils/imageUtils.ts
    
    - name: Run image-related unit tests
      run: npm test -- --testPathPattern=image || echo "No image tests found"
      continue-on-error: true
    
    - name: Check image routes configuration
      run: |
        echo "Validating image routes"
        npx tsc --noEmit src/routes/images.ts
    
    - name: Verify image optimization
      run: |
        echo "Verifying Sharp image processing"
        npm run build
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: images-test-results
        path: coverage/
        retention-days: 7
