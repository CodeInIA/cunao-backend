name: Orders & Payments

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'src/controllers/orderController.ts'
      - 'src/routes/orders.ts'
      - 'src/services/stripeService.ts'
      - 'src/services/printifyService.ts'
      - 'src/models/Client.ts'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'src/controllers/orderController.ts'
      - 'src/routes/orders.ts'
      - 'src/services/stripeService.ts'
      - 'src/services/printifyService.ts'
  workflow_dispatch:

jobs:
  test-orders:
    runs-on: ubuntu-latest
    
    env:
      NODE_ENV: test
      STRIPE_SECRET_KEY: sk_test_fake_key_for_workflow_compilation_only
      PRINTIFY_API_TOKEN: fake_printify_token_12345678901234567890
      PRINTIFY_SHOP_ID: "1234567"
      MONGODB_URI: mongodb://localhost:27017/test-db
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Test Order Controller
      run: |
        echo "Testing order creation, validation, and processing"
        npx tsc --noEmit src/controllers/orderController.ts
    
    - name: Test Stripe Service Integration
      run: |
        echo "Testing Stripe payment processing"
        npx tsc --noEmit src/services/stripeService.ts
    
    - name: Test Printify Service Integration
      run: |
        echo "Testing Printify order creation"
        npx tsc --noEmit src/services/printifyService.ts
    
    - name: Run order-related unit tests
      run: npm test -- --testPathPattern=order || echo "No order tests found"
      continue-on-error: true
    
    - name: Check order routes configuration
      run: |
        echo "Validating order routes"
        npx tsc --noEmit src/routes/orders.ts
    
    - name: Test order cleanup cron job
      run: |
        echo "Testing expired orders cleanup"
        npx tsc --noEmit src/cron/cleanupExpiredOrders.ts
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: orders-test-results
        path: coverage/
        retention-days: 7
