name: Newsletter & Email Marketing

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'src/controllers/newsletterController.ts'
      - 'src/routes/newsletter.ts'
      - 'src/models/Newsletter.ts'
      - 'src/services/emailService.ts'
      - 'src/cron/weeklyNewsletter.ts'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'src/controllers/newsletterController.ts'
      - 'src/routes/newsletter.ts'
  workflow_dispatch:

jobs:
  test-newsletter:
    runs-on: ubuntu-latest
    
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/test-db
      EMAIL_USER: test@example.com
      EMAIL_PASS: fake_email_password_12345
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Test Newsletter Controller
      run: |
        echo "Testing newsletter subscription and unsubscription"
        npx tsc --noEmit src/controllers/newsletterController.ts
    
    - name: Test Newsletter Model
      run: |
        echo "Testing newsletter subscriber schema"
        npx tsc --noEmit src/models/Newsletter.ts
    
    - name: Test Email Service
      run: |
        echo "Testing email sending functionality"
        npx tsc --noEmit src/services/emailService.ts
    
    - name: Run newsletter-related unit tests
      run: npm test -- --testPathPattern=newsletter || echo "No newsletter tests found"
      continue-on-error: true
    
    - name: Check newsletter routes configuration
      run: |
        echo "Validating newsletter routes"
        npx tsc --noEmit src/routes/newsletter.ts
    
    - name: Test weekly newsletter cron job
      run: |
        echo "Testing weekly newsletter sending"
        npx tsc --noEmit src/cron/weeklyNewsletter.ts
    
    - name: Verify email templates
      run: |
        echo "Verifying email template rendering"
        npm run build
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: newsletter-test-results
        path: coverage/
        retention-days: 7
