name: Webhooks & Integrations

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'src/controllers/webhookController.ts'
      - 'src/routes/webhooks.ts'
      - 'webhook-hash-calculator.js'
  pull_request:
    branches: [ master, develop ]
    paths:
      - 'src/controllers/webhookController.ts'
      - 'src/routes/webhooks.ts'
  workflow_dispatch:

jobs:
  test-webhooks:
    runs-on: ubuntu-latest
    
    env:
      NODE_ENV: test
      STRIPE_WEBHOOK_SECRET: whsec_fake_webhook_secret_1234567890abcdef
      PRINTIFY_WEBHOOK_SECRET: fake_printify_webhook_secret_abcd1234
      MONGODB_URI: mongodb://localhost:27017/test-db
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run webhook-related unit tests
      run: npm test -- --testPathPattern=webhook || echo "No webhook tests found"
      continue-on-error: true
    
    - name: Test webhook hash calculator
      run: |
        echo "Testing webhook signature calculation"
        node webhook-hash-calculator.js
      continue-on-error: true
    
    - name: Build and Type Check
      run: npm run build
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: webhooks-test-results
        path: coverage/
        retention-days: 7
